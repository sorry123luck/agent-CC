models:
  cloud_vision:
    enabled: false
    provider: openai_compatible
    endpoint: "https://api.example.com/v1/chat/completions"
    api_key_env: OPENCLAW_VLM_API_KEY
    model: "vision-model-name"
    timeout_seconds: 30
    max_retries: 1
    proxy:
      enabled: false
      url: ""

  image_describe:
    enabled: false
    endpoint: "https://api.example.com/v1/messages"
    api_key_env: OPENCLAW_IMAGE_DESCRIBE_API_KEY
    model: "vision-model-name"
    max_tokens: 500
    timeout: 30

ocr:
  engine: paddleocr
  worker_python: ""
  lang: ch

privacy:
  save_raw_screenshots: false
  save_raw_vlm_payloads: false

